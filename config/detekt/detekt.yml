# =============================================================================
# config/detekt/detekt.yml — the family standard.
# Canonical copy: /Users/darkpandawarrior/Repos/KMP/kmp-toolkit/config/detekt/detekt.yml
#
# Toolchain: dev.detekt 2.0.0-alpha.6 (NOT io.gitlab.arturbosch.detekt 1.x).
# Rules that only exist in 1.x (UnusedPrivateMember, MayBeConst) are deliberately absent.
#
# HOW TO READ THE EXCLUSIONS
#   Every `excludes:` and every `active: false` below carries the reason it is an
#   artefact. Adding one without a reason creates next year's mystery.
#
# THE TRAP THAT MAKES THIS FILE FRAGILE
#   detekt's `excludes:` REPLACES the built-in default list, it does not extend it.
#   Mileway's config records getting burned by this: omitting the test globs from
#   naming.FunctionNaming turned every backtick-named test function into a violation.
#   So the *notOurs anchor below re-lists detekt 2.0's defaults IN FULL, plus the KMP
#   test source sets detekt ships no default for but this family targets
#   (desktopTest, wasmJsTest, watchosTest, appleTest, nativeTest).
#   Anchor once, alias everywhere. SnakeYAML expands these before detekt's config
#   validation runs, so `config.validation: true` stays on.
#
# THIS REPO'S SHAPE — read before assuming the family numbers apply here.
#   cv-siddharth-kmp has NO Room/KSP codegen and NO generated code in its baseline:
#   all 203 baselined findings were hand-written source. The `**/build/generated/**`
#   exclusion that removes 66% of the family's debt removes exactly 0 here, and the
#   root build.gradle.kts already scopes detekt to `src` and excludes `**/build/**`
#   and `**/generated/**` besides. The exclusion stays because this is the family
#   file and a repo that later adds Room must not have to rediscover it.
# =============================================================================

config:
  validation: true
  warningsAsErrors: false

# -----------------------------------------------------------------------------
comments:
  # KDoc-on-everything produces noise, not documentation, in a UI-heavy codebase.
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

# -----------------------------------------------------------------------------
complexity:
  CyclomaticComplexMethod:
    # The full glob list lives here once and is aliased as *notOurs below.
    excludes: &notOurs
      - '**/build/generated/**'   # KSP/Room/Compose-resources output. Machine-written,
                                  # rewritten on every build, unformattable. Zero hits in
                                  # this repo today; kept because the family file is one file.
      # --- detekt 2.0's own defaults, restored verbatim. Do not drop any of these. ---
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
      # --- KMP source sets this family targets that detekt 2.0 ships no default for. ---
      - '**/desktopTest/**'
      - '**/wasmJsTest/**'
      - '**/watchosTest/**'
      - '**/appleTest/**'
      - '**/nativeTest/**'
      - '**/*.kts'                # Gradle scripts are configuration, not application logic.
    allowedComplexity: 20         # Family number: game-rule, parser and payment-orchestration
                                  # state machines are legitimately branchy.
    ignoreSimpleWhenEntries: true # A `when` over a sealed UiState is ONE decision expressed in
                                  # N arms, not N decisions. Honest reading of the metric.
  LongMethod:
    excludes: *notOurs
    allowedLines: 80
    ignoreAnnotated: &composable
      # Both forms on purpose. detekt's per-source-set KMP tasks run WITHOUT type resolution,
      # so FQN matching is not guaranteed; detekt's own Compose guide uses the simple name.
      - 'Composable'
      - 'androidx.compose.runtime.Composable'
  LongParameterList:
    excludes: *notOurs
    allowedFunctionParameters: 10      # A Compose entry point takes host + nav callbacks +
    allowedConstructorParameters: 10   # modifier + VM default.
    ignoreDefaultParameters: true      # A parameter with a default is not a burden on the caller.
    ignoreAnnotated: *composable
  TooManyFunctions:
    excludes: *notOurs
    allowedFunctionsPerFile: 40
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 15
    allowedFunctionsPerObject: 20
    allowedFunctionsPerEnum: 10
    ignoreAnnotatedFunctions:
      # A file holding thirty composables is a component catalogue; a file holding thirty
      # previews is a preview sheet. Neither is a god class. Prescribed by detekt's own
      # Compose guide: https://detekt.dev/docs/introduction/compose/
      # This does NOT rubber-stamp the rule — ordinary classes past 20 methods still fire.
      - 'Composable'
      - 'Preview'
  LargeClass:
    excludes: *notOurs
  NestedBlockDepth:
    excludes: *notOurs

# -----------------------------------------------------------------------------
coroutines:
  # These catch real structured-concurrency bugs and cost nothing.
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

# -----------------------------------------------------------------------------
empty-blocks:
  EmptyFunctionBlock:
    excludes: *notOurs
    ignoreOverridden: true
    # For an override, the empty body IS the implementation: no-op test doubles,
    # unimplemented platform stubs, listener adapters where only one callback of four is
    # wanted. An empty NON-override — a function somebody forgot to finish — still fires,
    # which is the case the rule was written for.

# -----------------------------------------------------------------------------
exceptions:
  TooGenericExceptionCaught:
    excludes: *notOurs
    active: true
    # DELIBERATELY OVERTURNING Mileway's and PaymentsLab's `active: false`. Their recorded
    # reason — "runCatching { } is idiomatic" — does not hold: this rule fires on `catch`
    # clauses and runCatching {} has none. It never triggered the rule.
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'Exception'
      - 'IllegalMonitorStateException'
      - 'NullPointerException'
      - 'RuntimeException'
      - 'Throwable'
    allowedExceptionNameRegex: '_|(ignored)'
  SwallowedException:
    excludes: *notOurs
    active: true                  # A swallowed exception is the bug you get paged for.
  TooGenericExceptionThrown:
    excludes: *notOurs
    active: true

# -----------------------------------------------------------------------------
naming:
  ClassNaming:
    excludes: *notOurs
  VariableNaming:
    excludes: *notOurs
    # Room's generated locals (`__db`, `_columnIndexOfCreatedAtMs`) are the artefact this
    # exclusion exists for. Hand-written SCREAMING_SNAKE locals are NOT covered and still fire.
  ConstructorParameterNaming:
    excludes: *notOurs
  FunctionParameterNaming:
    excludes: *notOurs
  FunctionNaming:
    excludes: *notOurs
    ignoreAnnotated: *composable
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    # Belt AND braces, on purpose. `ignoreAnnotated` is the precise instrument, but if the
    # annotation fails to match under a task running without type resolution, EVERY composable
    # becomes a violation at once. The permissive pattern is the proven fallback.
    # This replaces this repo's previous `active: false`, which switched the rule off for
    # ordinary functions too.
  TopLevelPropertyNaming:
    excludes: *notOurs
    constantPattern: '[A-Z][_A-Z0-9]*|[A-Z][A-Za-z0-9]*'
    # DELIBERATE DEVIATION from the family standard's bare '[A-Z][A-Za-z0-9]*', with the
    # measurement that forced it.
    #
    # The standard's pattern is right about Compose: AndroidX's own Compose source uses
    # PascalCase for top-level constants and detekt's Compose guide prescribes it
    # (https://detekt.dev/docs/introduction/compose/). This repo's previous attempt,
    # '[A-Z][_A-Z0-9]*|[a-z][a-zA-Z0-9]*', could never match PascalCase at all — which is why
    # all 31 of its hits were still firing. A half-right pattern is worse than none: it looks
    # handled.
    #
    # But the standard's supporting count ("all 32 flagged names are PascalCase, none
    # SCREAMING_SNAKE") was taken over BASELINED entries, i.e. exactly the set the old pattern
    # already rejected. It could not see what the old pattern was accepting. Counted here:
    # 183 top-level SCREAMING_SNAKE constants pass today, across ChessEngine.kt (0x88 board
    # masks, OFF_BOARD_MASK/RANK_STRIDE/MATE_SCORE), MapScreen.kt, SkillMatch.kt,
    # MermaidFlow.kt, Prerender.kt and ComposeInterpreter.kt (SINGLE_PUNC). Adopting the bare
    # PascalCase pattern would flag all 183 and demand a rename of constants that already
    # follow Kotlin's own coding conventions.
    #
    # So: accept BOTH idioms and keep what the rule is actually for. Compose tokens are
    # PascalCase; non-Compose algorithmic constants are SCREAMING_SNAKE. camelCase and
    # lowercase — the cases that genuinely read as a mutable local — are still rejected, which
    # is the 31 findings this repo carried.
  MatchingDeclarationName:
    active: false
    # DELIBERATE IDIOM, not laziness. This codebase groups small related declarations per file:
    # CommandPalette.kt holds PaletteCommand, CvGalleryData.kt holds CvGallery, HomeScreen.kt
    # holds HomeSection, ThemeLab.kt holds ThemeSeed.
    # MUST stay paired with `ktlint_standard_filename = disabled` in .editorconfig — one
    # without the other just moves the noise from one tool to the other.
  InvalidPackageDeclaration:
    excludes: *notOurs
    active: true                  # Never baseline a package/directory mismatch — it breaks IDE
                                  # navigation and symbol-level codegraph queries. Fix with `git mv`.

# -----------------------------------------------------------------------------
performance:
  SpreadOperator:
    active: false                 # Vararg spreading is idiomatic Kotlin at several engine and
                                  # DI call sites; the array-copy cost is irrelevant there.
  ForEachOnRange:
    excludes: *notOurs
    active: true                  # `(0..n).forEach` allocates; `for (i in 0..n)` does not.

# -----------------------------------------------------------------------------
style:
  MagicNumber:
    excludes: *notOurs
    active: true
    # NOT AN ARTEFACT RULE. A bare 111320.0 in a Kalman smoother, an HTTP 504, a 0.2126
    # luminance coefficient — those are the exact defect this rule exists to catch.
    # Turning MagicNumber off to make a number go down is rubber-stamping the debt.
    ignorePropertyDeclaration: true          # `val CardRadius = 16.dp` is self-documenting.
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreNamedArgument: true                # `alpha = 0.6f` names itself at the call site.
    ignoreEnums: true
      # `TurnSpeed.SLOW(1.4f)` — the enum entry name IS the name of the number.
    ignoreAnnotated:
      - 'Composable'
      - 'androidx.compose.runtime.Composable'
      # HONEST LIMIT, measured: this repo ALREADY carried this line and still held 112 UI-file
      # findings, because the survivors live in `DrawScope` extension functions and Canvas draw
      # lambdas, which carry no annotation for any ignore to match. Those are NOT artefacts —
      # `private const val NeedleRadiusFraction = 0.86f` is strictly better code.
      # BOTH Preview FQNs listed deliberately. androidx.compose.ui.tooling.preview.Preview IS
      # the multiplatform annotation from Compose Multiplatform 1.10.0 onward and works in
      # commonMain -- verified in this family: Mileway has 7 commonMain files importing the
      # androidx FQN and zero importing the org.jetbrains one, and they compile green.
      # org.jetbrains.compose.ui.tooling.preview.Preview is the LEGACY path, kept here only so
      # older or vendored code still matches. Do not "correct" androidx out of this list.
      - 'Preview'
      - 'androidx.compose.ui.tooling.preview.Preview'
      - 'org.jetbrains.compose.ui.tooling.preview.Preview'
      # PreviewLightDark / PreviewMatrix / PreviewFontScales / PreviewDevices / PreviewStates
      # are dropped: they are project-local annotations belonging to a sibling app and no such
      # declaration exists here (`grep -r '@Preview' src` returns nothing at all today). An
      # ignoreAnnotated entry naming an annotation the repo does not have is a claim that some
      # code is exempt when none is, which is worse than no entry.
    ignoreNumbers:
      # Keep this list SHORT. This repo previously listed 0 through 10 inclusive, which
      # silently exempts `if (retries > 5)` and `grade >= 7`; and '1000', which is a debounce
      # that deserves a name. -1/0/1/2 are detekt's defaults (identity, empty, off-by-one,
      # halving); 100 is percentage conversion; 360 is degrees.
      - '-1'
      - '0'
      - '1'
      - '2'
      - '100'
      - '360'
  MaxLineLength:
    active: false
    # NOT forgiveness — a SINGLE-OWNER decision. ktlint's standard:max-line-length owns line
    # length for this family, via .editorconfig, at one number. Two tools enforcing one rule at
    # two different numbers is how the family ended up with detekt at its 120 default and
    # .editorconfig at 160 in three repos and 120 in a fourth.
  WildcardImport:
    active: false
    # Compose and the design-system modules pull dozens of symbols per file and the IDE
    # collapses them. MUST stay paired with `ktlint_standard_no-wildcard-imports = disabled`.
  ForbiddenComment:
    active: false                 # TODO(ios)/TODO(wasm) markers track real unimplemented
                                  # platform actuals in a KMP tree; they are a map, not rot.
  ThrowsCount:
    excludes: *notOurs
    max: 3
    excludeGuardClauses: true     # `require`/`check` at the top of a function are precondition
                                  # declarations, not control flow.
    # NOTE it lives in `style`, not `exceptions`. The family standard files it under exceptions,
    # where dev.detekt 2.0.0-alpha.6 rejects it outright: "Property 'exceptions>ThrowsCount' is
    # misspelled or does not exist" — a hard task failure, not a warning, because
    # `config.validation` is on. Verified against default-detekt-config.yml inside
    # detekt-core-2.0.0-alpha.6.jar: exceptions has no ThrowsCount; style does.
  ReturnCount:
    excludes: *notOurs
    max: 4
    excludeGuardClauses: true
    # `?: return` / `if (x == null) return` at the top of a function are preconditions, not
    # branches; early return for Loading/Error/Empty is how a Compose screen is written.
    # Four real returns AFTER guards still fires, so the rule keeps its teeth.
  MayBeConstant:
    excludes: *notOurs
    active: true                  # `const val` is free and removes a field read per access on
                                  # a shader draw path.
  FunctionOnlyReturningConstant:
    excludes: *notOurs
    active: true
    ignoreOverridableFunction: true
    ignoreActualFunction: true    # A KMP `actual fun` returning a constant on one platform is
                                  # the whole point of expect/actual — the contract, not a smell.
  UnusedParameter:
    excludes: *notOurs
    allowedNames: '_|ignored|expected'
    # In a shared design-system module, dead parameter surface propagates to every consumer and
    # the next reader cannot tell a placeholder from a bug. Delete it or wire it up.
  UnusedPrivateFunction:
    excludes: *notOurs
    allowedNames: '(_|ignored|expected|serialVersionUID)'
    ignoreAnnotated:
      # A @Preview function is invoked by the IDE and by screenshot tests, never by application
      # code. Prescribed by detekt's Compose guide.
      # BOTH Preview FQNs listed deliberately. androidx.compose.ui.tooling.preview.Preview IS
      # the multiplatform annotation from Compose Multiplatform 1.10.0 onward and works in
      # commonMain -- verified in this family: Mileway has 7 commonMain files importing the
      # androidx FQN and zero importing the org.jetbrains one, and they compile green.
      # org.jetbrains.compose.ui.tooling.preview.Preview is the LEGACY path, kept here only so
      # older or vendored code still matches. Do not "correct" androidx out of this list.
      - 'Preview'
      - 'androidx.compose.ui.tooling.preview.Preview'
      - 'org.jetbrains.compose.ui.tooling.preview.Preview'
      # PreviewLightDark / PreviewMatrix / PreviewFontScales / PreviewDevices / PreviewStates
      # are dropped: they are project-local annotations belonging to a sibling app and no such
      # declaration exists here (`grep -r '@Preview' src` returns nothing at all today). An
      # ignoreAnnotated entry naming an annotation the repo does not have is a claim that some
      # code is exempt when none is, which is worse than no entry.
  UnusedPrivateProperty:
    excludes: *notOurs
    allowedNames: '(_|ignored|expected|serialVersionUID)'
  UnusedPrivateClass:
    excludes: *notOurs
    active: true
  LoopWithTooManyJumpStatements:
    excludes: *notOurs
    maxJumpCount: 2
    # One `continue` guard plus one `break` on the success case is a normal, readable scan
    # loop. Three jumps still fires.
