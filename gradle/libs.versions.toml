[versions]
agp = "9.5.0-alpha06"
detekt = "2.0.0-alpha.6"
ktlintPlugin = "14.2.0"
ktlintEngine = "1.7.1"
kotlin = "2.4.20"
compose-multiplatform = "1.13.0-alpha01"
androidx-activity = "1.14.0-alpha02"
coroutines = "1.11.0"
coil = "3.6.3"
ktor = "3.6.0"
kotlinx-serialization = "1.12.0-RC"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
# The Compose Multiplatform @Preview annotation, usable directly in composeMain.
# Since CMP 1.10 the annotation this artifact publishes IS androidx.compose.ui.tooling.preview.Preview
# -- the AndroidX one, made multiplatform. org.jetbrains.compose.ui.tooling.preview.Preview and the
# old org.jetbrains.compose.components:components-ui-tooling-preview artifact are the DEPRECATED
# path; every pre-2026 blog post says the opposite. Verified against the published sources jar:
# ui-tooling-preview-1.13.0-alpha01-sources.jar carries commonMain/androidx/compose/ui/tooling/
# preview/{Preview,MultiPreviews,PreviewParameter,PreviewWrapper}.kt.
# Publishes android/desktop/iosArm64/iosSimulatorArm64/js/macosArm64/wasmJs -- exactly composeMain's
# target set, which is why it goes there and not in commonMain (no iosX64, no watchOS artifacts).
ui-tooling-preview-mp = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
